[workspace]
members = [
  # SuperTool
  "tauri", "cli", "core",
]
resolver = "2"

[workspace.package]
version = "6.70.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fufengyuan/supertool"

[workspace.dependencies]
# === Async runtime ===
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# === HTTP / networking ===
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio-tungstenite = "0.24"
eventsource-stream = "0.2"

# === Error handling & logging ===
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"
env_logger = "0.11"

# === CLI & TUI ===
clap = { version = "4", features = ["derive"] }

# === Database ===
rusqlite = { version = "0.32", features = ["bundled"] }

# === Time ===
chrono = { version = "0.4", features = ["serde"] }

# === Common utility crates (used by ultra crates) ===
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
which = "7"
dirs = "6"
lazy_static = "1"
async-stream = "0.3"
proptest = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"
minijinja = "2"
cron = "0.15"
crossterm = "0.28"
directories = "6"
jsonwebtoken = "9"
once_cell = "1"
ratatui = "0.29"
tui-textarea = "0.7"

[profile.dev]
incremental = true
codegen-units = 256

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[profile.test]
incremental = true
