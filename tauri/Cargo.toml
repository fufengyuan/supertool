[package]
name = "supertool"
version = "4.66.7"
description = "SuperTool - Tauri 2.0 Migration"
authors = ["fufengyuan"]
edition = "2024"

[[bin]]
name = "supertool"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "devtools", "test"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# Database
supertool-core = { path = "../core" }
supertool-claw = { path = "../claw-cli" }
api = { path = "../claw" }
runtime = { path = "../claw-runtime" }
commands = { path = "../claw-commands" }
tools = { path = "../claw-tools" }
plugins = { path = "../claw-plugins" }
rusqlite = { version = "0.32", features = ["bundled"] }
mysql_async = "0.35"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5"
redis = { version = "0.32", features = ["tokio-comp", "streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
libc = "0.2"

# Encryption
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
scrypt = "0.11"

# Async
tokio = { version = "1", features = ["full"] }

# SSH (later: openssh crate)
# For now: exec via shell

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# Compression
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

# Error handling
thiserror = "1"
dirs = "6.0.0"
jwalk = "0.8"
hmac = "0.13.0"
sha1 = "0.11.0"
log = { version = "0.4.29", features = ["std"] }
anyhow = "1.0.102"
ssh2 = "0.9.5"
notify-rust = "4"
openssl = { version = "0.10", features = ["vendored"] }
boringtun = "0.7"
tun2 = { version = "4", features = ["async"] }
rand = "0.8"
if-addrs = "0.13"
socket2 = "0.5"
hostname = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
html2md = "0.2"
shellexpand = "3.1.2"
lazy_static = "1.4"
serde_yaml = "0.9"
futures = "0.3"

# === Hermes Ultra ===
hermes-config = { path = "../hermes-config" }
hermes-core = { path = "../hermes-core" }
hermes-cron = { path = "../hermes-cron" }
hermes-skills = { path = "../hermes-skills" }
hermes-gateway = { path = "../hermes-gateway" }
hermes-agent = { path = "../hermes-agent" }
hermes-tools = { path = "../hermes-tools" }
hermes-environments = { path = "../hermes-environments" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
