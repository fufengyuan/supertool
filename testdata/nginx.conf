# SuperTool Test Nginx Configuration
# 这是一个完整的 nginx 配置，用于测试逆向解析功能
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# 加载动态模块
load_module modules/ngx_http_geoip_module.so;
load_module modules/ngx_stream_module.so;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 基础优化参数
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 地图（map 块应被跳过）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 上游 - 轮询策略
    upstream backend_api {
        # 后端 API 服务
        server 10.0.0.1:8080 weight=5 max_fails=3 fail_timeout=30s;
        server 10.0.0.2:8080 weight=3 max_fails=3 fail_timeout=30s;
        server 10.0.0.3:8080 weight=2 backup;
    }

    # 上游 - IP 哈希
    upstream user_service {
        ip_hash;
        server 10.0.1.1:8081;
        server 10.0.1.2:8081;
        server 10.0.1.3:8081 down;
    }

    # 上游 - 最少连接
    upstream websocket_servers {
        least_conn;
        server 10.0.2.1:9000 max_conns=200;
        server 10.0.2.2:9000 max_conns=200;
    }

    # 上游 - 随机策略
    upstream static_assets {
        random;
        server 192.168.1.10:80 weight=10;
        server 192.168.1.11:80 weight=5;
    }

    # =========== Server 1：主站 HTTPS ===========
    server {
        # 主站配置
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name  www.example.com example.com;

        # SSL 证书
        ssl_certificate      /etc/nginx/ssl/example.com/fullchain.pem;
        ssl_certificate_key  /etc/nginx/ssl/example.com/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # 访问认证
        auth_basic           "Restricted Area - Authorized Access Only";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 根路径 → 反向代理到后端
        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 路径
        location /api/ {
            proxy_pass http://backend_api/v2/;
            proxy_set_header Host $host;

            # CORS 头
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # 静态文件
        location /static/ {
            root /var/www/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket 代理
        location /ws/ {
            proxy_pass http://websocket_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # 301 重定向
        location /old-path {
            return 301 https://www.example.com/new-path;
        }

        # 健康检查
        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    # =========== Server 2：HTTP 重定向 ===========
    server {
        listen 80;
        listen [::]:80;
        server_name  www.example.com example.com;
        # HTTP 自动跳转 HTTPS
        return 301 https://$server_name$request_uri;
    }

    # =========== Server 3：管理后台（内网） ===========
    server {
        listen 127.0.0.1:8080;
        server_name admin.example.com;

        location / {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }

        # 内网限制
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # =========== Server 4：文件服务 ===========
    server {
        listen 80;
        server_name  static.example.com cdn.example.com;

        location / {
            root /var/www/static;
            index index.html;
        }

        location /images/ {
            root /data/images;
            expires max;
        }

        location /download/ {
            root /data/files;
            add_header Content-Disposition "attachment";
        }
    }
}

# =========== Stream 代理 ===========
stream {
    # MySQL 代理
    server {
        listen 3306;
        proxy_pass 10.0.10.1:3306;
        proxy_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # Redis 代理（通过 upstream）
    upstream redis_cluster {
        server 10.0.20.1:6379;
        server 10.0.20.2:6379;
        server 10.0.20.3:6379;
    }

    server {
        listen 6379;
        proxy_pass redis_cluster;
        proxy_timeout 30s;
    }

    # SSL 加密流
    server {
        listen 4433;
        proxy_pass 10.0.30.1:4433;
        ssl on;
        ssl_certificate /etc/nginx/ssl/stream/cert.pem;
        protocol TCP;
    }
}
