worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
load_module modules/ngx_http_geoip_module.so;
load_module modules/ngx_stream_module.so;
events {
worker_connections 1024;
multi_accept on;
use epoll;
    }

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    log_format main '$remote_addr - $remote_user [$time_local] "$request"  $status $body_bytes_sent "$http_referer"  "$http_user_agent" "$http_x_forwarded_for"';
    map $http_upgrade $connection_upgrade {
    default upgrade;
     close;
}

    upstream backend_api {
        server 10.0.0.1:8080 weight=5 fail_timeout=30s;
        server 10.0.0.2:8080 weight=3 fail_timeout=30s;
        server 10.0.0.3:8080 weight=2 backup;
  }

    upstream user_service {
        ip_hash;
        server 10.0.1.1:8081;
        server 10.0.1.2:8081;
        server 10.0.1.3:8081 down;
  }

    upstream websocket_servers {
        least_conn;
        server 10.0.2.1:9000 max_conns=200;
        server 10.0.2.2:9000 max_conns=200;
  }

    upstream static_assets {
        random;
        server 192.168.1.10:80 weight=10;
        server 192.168.1.11:80 weight=5;
  }

    server {
        server_name  www.example.com example.com;
        listen 443 default_server ssl http2;
        listen [::]:443 default_server ssl;
        ssl_certificate      /etc/nginx/ssl/example.com/fullchain.pem;
        ssl_certificate_key  /etc/nginx/ssl/example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
    }

        location /api/ {
            proxy_pass http://backend_api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
    }

        location /static/ {
            expires 30d;
            add_header Cache-Control public, immutable;
    }

        location /ws/ {
            proxy_pass http://websocket_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
    }

        location /old-path {
    }

        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            access_log off;
    }

  }

    server {
        server_name  www.example.com example.com;
        listen 80;
        listen [::]:80;
  }

    server {
        server_name  admin.example.com;
        listen 8080;
        allow all;
        location / {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
    }

  }

    server {
        server_name  static.example.com cdn.example.com;
        listen 80;
        location / {
            index index.html;
    }

        location /images/ {
            expires max;
    }

        location /download/ {
            add_header Content-Disposition attachment;
    }

  }

}

stream {
    server {
        listen 3306;
        proxy_pass 10.0.10.1:3306;
  }

    server {
        listen 6379;
        proxy_pass redis_cluster;
  }

    server {
        listen 4433;
        ssl_protocols TLSv1.2 TLSv1.3;
        protocol TCP;
        proxy_pass 10.0.30.1:4433;
  }

}

