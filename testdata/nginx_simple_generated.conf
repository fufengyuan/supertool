worker_processes 1;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;
events {
worker_connections 128;
    }

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        server_name  simple.example.com;
        listen 80;
        location / {
            root /var/www/html;
            index index.html;
        }

    }

}

