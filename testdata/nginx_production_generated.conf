    server {
        server_name  unionmch.duormi.com;
        listen 443 ssl http2;
        listen 80;
        ssl_certificate      /home/nginxWebUI/cert/*.duormi.com/duormi.com.pem;\n        ssl_certificate_key  /home/nginxWebUI/cert/*.duormi.com/duormi.com.key;\n        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        location /api {
            proxy_pass http://localhost:9218;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect http:// https://;
    }

        location / {
            proxy_redirect http:// https://;
            gzip_static on;
            add_header Cache-Control public;
            gzip on;
            gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;
            gzip_proxied any;
            try_files $uri $uri/ /index.html;
    }

        if ($scheme = http) {
            return 301 https://$host:80$request_uri;
        }
  }

