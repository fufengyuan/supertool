    server {
        server_name  ~^prepay-.*\.gmceo\.cn$;
        listen 443 ssl http2;
        listen 80;
        ssl_certificate      /home/nginxWebUI/cert/gmceo/cert.pem;\n        ssl_certificate_key  /home/nginxWebUI/cert/gmceo/key.key;\n        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        location /admin-api/ {
            proxy_pass http://$prepay_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_redirect http:// https://;
    }

        location /infra {
            proxy_pass http://$prepay_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_redirect http:// https://;
    }

        location /robots.txt {
            proxy_redirect http:// https://;
    }

        location / {
            proxy_redirect http:// https://;
            index index.html;
            try_files $uri $uri/ @router;
            error_page 403 = @ops-coffee;
            gzip_static on;
            expires 30d;
            add_header Cache-Control public;
            gzip on;
            gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;
            gzip_proxied any;
    }

        location @router {
            proxy_redirect http:// https://;
            rewrite ^.*$ /index.html last;
    }

        location @ops-coffee {
            proxy_redirect http:// https://;
            rewrite .* /index permanent;
    }

        if ($scheme = http) {
            return 301 https://$host:80$request_uri;
        }
  }

