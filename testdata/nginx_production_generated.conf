load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes auto;
events {
worker_connections 1024;
accept_mutex on;
    }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    include mime.types;
    default_type application/octet-stream;
    geo $remote_addr $topup_api {
    default prod_backend;
    203.0.113.10/32 gray_backend;
}
    geo $remote_addr $shop_base {
    default shop_base_prod;
    203.0.113.10/32 shop_base_gray;
}
    geo $remote_addr $shop_buyer {
    default shop_buyer_prod;
    203.0.113.10/32 shop_buyer_gray;
}
    geo $remote_addr $shop_seller {
    default shop_seller_prod;
    203.0.113.10/32 shop_seller_gray;
}
    geo $remote_addr $shop_admin {
    default shop_admin_prod;
    203.0.113.10/32 shop_admin_gray;
}
    log_format custom $remote_addr - $remote_user [$time_local]  "$request" $status $body_bytes_sent  "$http_referer" "$http_user_agent"  $upstream_addr $upstream_response_time;

    upstream shop_admin_gray {
        server 203.0.113.13:7004;
    }

    upstream shop_admin_prod {
        server 203.0.113.13:7004;
    }

    upstream shop_seller_gray {
        server 203.0.113.13:7003;
    }

    upstream shop_seller_prod {
        server 203.0.113.13:7003;
    }

    upstream shop_buyer_gray {
        server 203.0.113.13:7002;
    }

    upstream shop_buyer_prod {
        server 203.0.113.13:7002;
    }

    upstream shop_base_gray {
        server 203.0.113.13:7000;
    }

    upstream shop_base_prod {
        server 203.0.113.13:7000;
    }

    upstream gray_backend {
        server 203.0.113.13:48080;
    }

    upstream prod_backend {
        server 203.0.113.13:48080;
    }

    server {
        server_name  unionmch.example.com;
        listen 443 ssl http2;
        location /api {
            proxy_pass http://localhost:9218;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
        }

    }

    server {
        server_name  union.example.com;
        listen 443 ssl http2;
        location /api {
            proxy_pass http://localhost:9216;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /MP_verify_yFbbf9ztOFUtKB7K.txt {
        }

        location / {
        }

    }

    server {
        server_name  unionmgr.example.com;
        listen 443 ssl http2;
        location /api {
            proxy_pass http://localhost:9217;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
        }

    }

    server {
        server_name  buyer-shop.example.net;
        listen 443 ssl http2;
        location /robots.txt {
        }

        location / {
        }

    }

    server {
        server_name  ~^topup-.*\.example\.net$;
        listen 443 ssl http2;
        location /admin-api/ {
            proxy_pass http://$topup_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /infra {
            proxy_pass http://$topup_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /robots.txt {
        }

        location / {
        }

        location @router {
        }

        location @ops-coffee {
        }

    }

    server {
        server_name  topup-api.example.net;
        listen 443 ssl http2;
        location / {
            proxy_pass http://$topup_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

    }

    server {
        server_name  api-shop.example.net;
        listen 443 ssl;
        location ^~ /base-api/ {
            proxy_pass http://$shop_base;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location ^~ /buyer-api/ {
            proxy_pass http://$shop_buyer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location ^~ /seller-api/ {
            proxy_pass http://$shop_seller;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location ^~ /admin-api/ {
            proxy_pass http://$shop_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

    }

    server {
        server_name  seller-shop.example.net;
        listen 443 ssl;
        location /robots.txt {
        }

        location / {
        }

    }

    server {
        server_name  admin-shop.example.net;
        listen 443 ssl;
        location /robots.txt {
        }

        location / {
        }

    }

}

