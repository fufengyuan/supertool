# Config 5: 复杂反向代理 — Upstream 负载均衡 + 条件转发
worker_processes  4;
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript;

    # 日志
    log_format json escape=json '{"time":"$time_local","host":"$host","uri":"$uri","status":$status}';
    access_log /var/log/nginx/access.log json;

    # 上游：Web 应用集群
    upstream web_cluster {
        least_conn;
        server 10.0.100.1:8080 weight=10 max_fails=3 fail_timeout=30s;
        server 10.0.100.2:8080 weight=10 max_fails=3 fail_timeout=30s;
        server 10.0.100.3:8080 weight=5  max_fails=3 fail_timeout=30s;
        server 10.0.100.4:8080 backup;
    }

    # 上游：微服务 A
    upstream service_a {
        random two least_conn;
        server 10.0.200.1:9001;
        server 10.0.200.2:9001;
        server 10.0.200.3:9001 down;
    }

    # 上游：微服务 B（一致性哈希）
    upstream service_b {
        hash $request_uri consistent;
        server 10.0.200.10:9002;
        server 10.0.200.11:9002;
    }

    # 上游：静态资源 CDN
    upstream static_cdn {
        server 192.168.1.10:80 weight=3;
        server 192.168.1.11:80 weight=3;
        server 192.168.1.12:80 weight=3;
    }

    # =========== 主站 ===========
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.example.com example.com;

        ssl_certificate     /etc/nginx/ssl/example.com/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/example.com/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        # 访问认证
        auth_basic           "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 默认 → Web 集群
        location / {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 服务 A
        location /service-a/ {
            proxy_pass http://service_a;
            proxy_set_header Host $host;
        }

        # 服务 B
        location /service-b/ {
            proxy_pass http://service_b;
            proxy_set_header Host $host;
        }

        # 静态资源
        location /static/ {
            proxy_pass http://static_cdn;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        # 大文件上传
        location /upload {
            client_max_body_size 500m;
            proxy_pass http://web_cluster;
            proxy_read_timeout 300s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # CORS 预检
        location /cors/ {
            proxy_pass http://service_a;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
        }

        # 内部监控（内网白名单）
        location /internal/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://127.0.0.1:9090;
        }

        # 301 重定向（旧路径）
        location /old-homepage {
            return 301 https://www.example.com/;
        }

        location /old-blog {
            return 302 /blog/;
        }
    }

    # =========== HTTP 跳转 ===========
    server {
        listen 80;
        listen [::]:80;
        server_name www.example.com example.com;
        return 301 https://$server_name$request_uri;
    }
}
