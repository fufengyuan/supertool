load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes auto;
events {
worker_connections 1024;
accept_mutex on;
    }

http {

    include mime.types;
    default_type application/octet-stream;
    client_header_buffer_size 512k;
    large_client_header_buffers 4 512k;
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_temp_path /home/nginxWebUI/temp;
    proxy_cache_path /home/nginxWebUI/temp/cache levels=1:2 keys_zone=cache_one:200m inactive=1d max_size=30g;
    disable_symlinks off;
    geo $remote_addr $shop_buyer {
    default shop_buyer_prod;
    192.168.1.0/24 shop_buyer_gray;
    203.25.217.25/32 shop_buyer_gray;
}
    geo $remote_addr $prepay_api {
    default prod_backend;
    192.168.1.0/24 gray_backend;
    203.25.217.25/32 gray_backend;
}
    client_max_body_size 200M;
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 8;
    gzip_types text/css text/javascript text/xml text/plain application/javascript application/x-javascript application/json;
    gzip_vary off;
    gzip_disable MSIE [1-6]\.;
    gzip_static on;
    add_header Cache-Control public;
    gzip_proxied any;

    upstream gray_backend {
        server 110.110.110.110:41231;
  }

    upstream prod_backend {
        server 127.0.0.1:48080;
  }

    upstream shop_buyer_prod {
        server 127.0.0.1:7002;
  }

    upstream shop_buyer_gray {
        server 110.110.110.110:1233;
  }

    upstream pay-api {
        server 172.17.0.1:9216;
  }

    upstream mch-api {
        server 172.17.0.1:9218;
  }

    upstream mgr-api {
        server 172.17.0.1:9217;
  }

    server {
        listen 29000;
        location / {
            proxy_pass https://www.paypal.com;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 2;
    }

  }

