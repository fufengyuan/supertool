load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes auto;
events {
    worker_connections  1024;
    accept_mutex on;
  }
http {
  include mime.types;
  default_type application/octet-stream;
  geo $remote_addr $prepay_api {
        default        prod_backend;  # 默认生产环境
        203.25.217.25/32  gray_backend;  # 走灰度环境
  }
  geo $remote_addr $shop_base {
        default        shop_base_prod;  # 默认生产环境
        203.25.217.25/32  shop_base_gray;  # 走灰度环境
  }
  geo $remote_addr $shop_buyer {
        default        shop_buyer_prod;  # 默认生产环境
        203.25.217.25/32  shop_buyer_gray; # 走灰度环境
  }
  geo $remote_addr $shop_seller {
        default        shop_seller_prod;  # 默认生产环境
        203.25.217.25/32  shop_seller_gray;  # 走灰度环境
  }
  geo $remote_addr $shop_admin {
        default        shop_admin_prod;  # 默认生产环境
        203.25.217.25/32  shop_admin_gray;  # 走灰度环境
  }
  log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '$upstream_addr $upstream_response_time';
  upstream shop_admin_gray {
    server 192.168.0.3:7004 ;
  }
  upstream shop_admin_prod {
    server 192.168.0.2:7004 ;
  }
  upstream shop_seller_gray {
    server 192.168.0.3:7003 ;
  }
  upstream shop_seller_prod {
    server 192.168.0.2:7003 ;
  }
  upstream shop_buyer_gray {
    server 192.168.0.3:7002 ;
  }
  upstream shop_buyer_prod {
    server 192.168.0.2:7002 ;
  }
  upstream shop_base_gray {
    server 192.168.0.3:7000 ;
  }
  upstream shop_base_prod {
    server 192.168.0.2:7000 ;
  }
  upstream gray_backend {
    server 192.168.0.3:48080 ;
  }
  upstream prod_backend {
    server 192.168.0.2:48080 ;
  }
  server {
    server_name zytfyou.com;
    listen 443 ssl http2;
    ssl_certificate /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.pem;
    ssl_certificate_key /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    listen 80;
    if ($scheme = http) {
      return 301 https://$host:443$request_uri;
    }
    location / {
      proxy_pass https://www.zytfyou.com;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http:// https://;
    }
  }
  server {
    server_name web.zytfyou.com;
    listen 443 ssl http2;
    ssl_certificate /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.pem;
    ssl_certificate_key /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    listen 80;
    if ($scheme = http) {
      return 301 https://$host:443$request_uri;
    }
    location /MP_verify_c2cS2o1AKUGZGgEx.txt {
      root /home/nginxWebUI/ui/pre-pay;
    }
    location /MP_verify_Dnbwjw21xHnMAeii.txt {
      root /home/nginxWebUI/txt;
    }
    location /pre-mer {
      root /home/nginxWebUI/ui/pre-pay/;
      try_files $uri $uri/ /pre-mer/index.html;
      gzip_static on;
      add_header Cache-Control "public";
      gzip on;
      gzip_types text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;
      gzip_proxied any;
    }
    location /pre-expand {
      root /home/nginxWebUI/ui/pre-pay/;
      try_files $uri $uri/ /pre-expand/index.html;
      gzip_static on;
      add_header Cache-Control "public";
      gzip on;
      gzip_types text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;
      gzip_proxied any;
    }
  }
  server {
    server_name www.zytfyou.com;
    listen 443 ssl http2;
    ssl_certificate /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.pem;
    ssl_certificate_key /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    listen 80;
    if ($scheme = http) {
      return 301 https://$host:443$request_uri;
    }
    set $root_path /home/nginxWebUI/ui/pre-pay/buyer;
    set $site_dir pc;
    if ($http_user_agent ~* "(android|iphone|ipod|blackberry|windows phone|wechat|qq|micromessenger|qqbrowser)") {
        set $site_dir "mobile";
      }
    if ($http_user_agent ~* "ipad") {
        set $site_dir "pc";
      }
    location /MP_verify_c2cS2o1AKUGZGgEx.txt {
      root /home/nginxWebUI/ui/pre-pay;
    }
    location /MP_verify_Dnbwjw21xHnMAeii.txt {
      root /home/nginxWebUI/txt;
    }
    location /eaa75361e747fb239fb14771459c7053.txt {
      root /home/nginxWebUI/txt;
    }
    location /1cca11a1b0ad71ca516c18643558fb75.txt {
      root /home/nginxWebUI/txt;
    }
    location /air-ticket {
      root /home/nginxWebUI/ui/pre-pay/;
      try_files $uri $uri/ /air-ticket/index.html;
    }
    location /life-hub {
      root /home/nginxWebUI/ui/pre-pay/;
      try_files $uri $uri/ /life-hub/index.html;
    }
    location /JO2diQp3mo.txt {
      root /home/nginxWebUI/txt/;
    }
    location /rules {
      return 301 https://www.zytfyou.com/pagesSub/rules/index;
    }
    location /mchs {
      return 301 https://www.zytfyou.com/pagesSub/merchant/index/index;
    }
    location / {
      root $root_path/$site_dir;
      try_files $uri $uri/ /index.html;
      gzip_static on;
      add_header Cache-Control "public";
      gzip on;
      gzip_types text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;
      gzip_proxied any;
    }
  }
  server {
    server_name ~^prepay-.*\.zytfyou\.com$;
    listen 443 ssl http2;
    ssl_certificate /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.pem;
    ssl_certificate_key /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    listen 80;
    if ($scheme = http) {
      return 301 https://$host:443$request_uri;
    }
    client_max_body_size 20M;
    location /admin-api/ {
      proxy_pass http://$prepay_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods *;
      add_header Access-Control-Allow-Headers *;
      add_header Access-Control-Allow-Credentials true;
      if ($request_method = 'OPTIONS') {
        return 204;
      }
      proxy_redirect http:// https://;
    }
    location /infra {
      proxy_pass http://$prepay_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods *;
      add_header Access-Control-Allow-Headers *;
      add_header Access-Control-Allow-Credentials true;
      if ($request_method = 'OPTIONS') {
        return 204;
      }
      proxy_redirect http:// https://;
    }
    location /robots.txt {
      root /home/nginxWebUI/ui/robots.txt;
    }
    location / {
      root /home/nginxWebUI/ui/pre-pay/admin/;
      index index.html;
      try_files $uri $uri/ @router;
      error_page 403 = @ops-coffee;
      gzip_static on;
      expires 30d;
      add_header Cache-Control "public";
      gzip on;
      gzip_types text/css
        text/javascript
        text/xml
        text/plain
        application/javascript
        application/x-javascript
        application/json;
      gzip_proxied any;
    }
    location @router {
      rewrite ^.*$ /index.html last;
    }
    location @ops-coffee {
      rewrite .* /index permanent;
    }
  }
  server {
    server_name prepay-api.zytfyou.com;
    listen 443 ssl http2;
    ssl_certificate /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.pem;
    ssl_certificate_key /home/nginxWebUI/cert/*.zytfyou.com/_.zytfyou.com.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    listen 80;
    if ($scheme = http) {
      return 301 https://$host:443$request_uri;
    }
    location /JO2diQp3mo.txt {
      root /home/nginxWebUI/txt/;
    }
    location / {
      proxy_pass http://$prepay_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_redirect http:// https://;
    }
  }
