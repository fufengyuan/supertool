stream {
  upstream radar {
    server 192.168.0.4:6580 ;
  }
  upstream xxl-job {
    server 192.168.0.4:8082 ;
  }
  upstream redis {
    server 192.168.0.4:6379 ;
  }
  upstream rustfs {
    server 192.168.0.4:9001 ;
  }
  upstream kibana {
    server 192.168.0.4:5601 ;
  }
  upstream mangodb {
    server 192.168.0.4:27017 ;
  }
  upstream rabbitmq {
    server 192.168.0.4:15672 ;
  }
  upstream mysql {
    server 192.168.0.4:3306 ;
  }
  server {
    listen 6580;
    proxy_pass radar;
  }
  server {
    listen 0.0.0.0:8082;
    proxy_pass xxl-job;
  }
  server {
    listen 0.0.0.0:6379;
    proxy_pass redis;
  }
  server {
    listen 0.0.0.0:9001;
    proxy_pass rustfs;
  }
  server {
    listen 0.0.0.0:5601;
    proxy_pass kibana;
  }
  server {
    listen 0.0.0.0:27017;
    proxy_pass mangodb;
  }
  server {
    listen 0.0.0.0:15672;
    proxy_pass rabbitmq;
  }
  server {
    listen 0.0.0.0:3306;
    proxy_pass mysql;
  }
}