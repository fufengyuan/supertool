# Config 4: 纯端口转发 — Stream + 四层代理
worker_processes  auto;

events {
    worker_connections  4096;
}

stream {
    # MySQL 主库
    server {
        listen 3306;
        proxy_pass 10.0.10.1:3306;
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # MySQL 从库（带 upstream 负载均衡）
    upstream mysql_slaves {
        server 10.0.10.2:3306;
        server 10.0.10.3:3306;
    }

    server {
        listen 3307;
        proxy_pass mysql_slaves;
    }

    # Redis 集群
    upstream redis_cluster {
        least_conn;
        server 10.0.20.1:6379 max_conns=100;
        server 10.0.20.2:6379 max_conns=100;
        server 10.0.20.3:6379 max_conns=50 backup;
    }

    server {
        listen 6379;
        proxy_pass redis_cluster;
        proxy_timeout 30s;
    }

    # MongoDB
    server {
        listen 27017;
        proxy_pass 10.0.30.1:27017;
    }

    # SSL 加密的 TCP 转发
    server {
        listen 4433;
        proxy_pass 10.0.40.1:4433;
        ssl on;
        ssl_certificate /etc/ssl/certs/stream/cert.pem;
        ssl_certificate_key /etc/ssl/private/stream/key.pem;
        protocol TCP;
    }

    # UDP DNS 转发
    server {
        listen 53 udp;
        proxy_pass 10.0.50.1:53;
        proxy_timeout 2s;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 健康检查页面
    server {
        listen 8080;
        server_name localhost;
        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
