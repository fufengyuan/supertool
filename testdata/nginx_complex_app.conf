# Config 6: 反向代理 + 缓存 + 安全头 + 多 Server
worker_processes  auto;
error_log         /var/log/nginx/error.log crit;
pid               /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nodelay   on;
    server_tokens off;

    # 缓存配置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=mycache:10m max_size=1g inactive=60m;

    # 上游：PHP 应用
    upstream php_app {
        server 127.0.0.1:9000;
    }

    # 上游：Node 应用
    upstream node_app {
        ip_hash;
        server 127.0.0.1:3000 weight=2;
        server 127.0.0.1:3001;
    }

    # 上游：Python 应用
    upstream python_api {
        least_conn;
        server 127.0.0.1:5000;
        server 127.0.0.1:5001;
    }

    # ====== 主站：WordPress ======
    server {
        listen 80;
        server_name  wordpress.example.com;

        root /var/www/wordpress;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            fastcgi_pass php_app;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location /wp-content/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /wp-admin/\n";
        }

        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ====== Node.js 应用 ======
    server {
        listen 3000;
        server_name  nodeapp.local;

        location / {
            proxy_pass http://node_app;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }

    # ====== Python API ======
    server {
        listen 5000;
        server_name  api.local;

        location / {
            proxy_pass http://python_api;
            proxy_set_header Host $host;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "Authorization";
        }

        location /docs {
            root /var/www/api-docs;
        }
    }

    # ====== 图片服务器 ======
    server {
        listen 80;
        server_name  images.example.com cdn.example.com;

        location / {
            root /data/images;
            expires max;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location /thumbs {
            root /data/images/thumbs;
            expires 7d;
        }

        location /private {
            internal;
            root /data/images/private;
        }
    }

    # ====== Redmine（子路径） ======
    server {
        listen 80;
        server_name  dev.example.com;

        location /redmine/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }

        location /gitlab/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
        }

        location /jenkins/ {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
        }

        location / {
            root /var/www/dev-portal;
        }
    }
}

stream {
    # SSH 转发
    server {
        listen 2222;
        proxy_pass 10.0.0.1:22;
    }
}
