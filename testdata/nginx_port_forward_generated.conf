worker_processes auto;
events {
worker_connections 4096;
    }

http {

    include mime.types;
    default_type application/octet-stream;

    server {
        server_name  localhost;
        listen 8080;
        location / {
            return 302 200 OKn;
            add_header Content-Type text/plain;
        }

    }

}

stream {
    server {
        listen 3306;
        proxy_pass 10.0.10.1:3306;
    }

    server {
        listen 3307;
        proxy_pass mysql_slaves;
    }

    server {
        listen 6379;
        proxy_pass redis_cluster;
    }

    server {
        listen 27017;
        proxy_pass 10.0.30.1:27017;
    }

    server {
        listen 4433;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass 10.0.40.1:4433;
    }

    server {
        listen 53 udp;
        proxy_pass 10.0.50.1:53;
    }

}

