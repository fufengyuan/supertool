worker_processes auto;
events {
worker_connections 2048;
multi_accept on;
    }

http {

    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 50m;

    upstream shop-backend {
        server 10.0.1.1:8080 weight=5;
        server 10.0.1.2:8080 weight=3;
        server 10.0.1.3:8080 backup;
    }

    upstream shop-ws {
        ip_hash;
        server 10.0.2.1:9000;
        server 10.0.2.2:9000;
    }

    upstream api-backend {
        least_conn;
        server 10.0.3.1:3000;
        server 10.0.3.2:3000;
        server 10.0.3.3:3000;
    }

    upstream admin-backend {
        random;
        server 10.0.4.1:9090;
        server 10.0.4.2:9090;
    }

    server {
        server_name  blog.example.com www.blog.example.com;
        listen 80;
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location \.php$ {
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location /static/ {
            expires 7d;
            add_header Cache-Control public;
        }

    }

    server {
        server_name  shop.example.com;
        listen 443 ssl;
        ssl_certificate      /etc/ssl/certs/shop/shop.pem;
        ssl_certificate_key  /etc/ssl/private/shop/shop.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://shop-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /ws {
            proxy_pass http://shop-ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /health {
            proxy_pass http://127.0.0.1:8080/health;
            access_log off;
        }

    }

    server {
        server_name  api.example.com api.internal.example.com;
        listen 80;
        location / {
            proxy_pass http://api-backend/v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /admin {
            proxy_pass http://admin-backend;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
        }

        location /files {
            add_header Content-Disposition attachment;
        }

    }

}

