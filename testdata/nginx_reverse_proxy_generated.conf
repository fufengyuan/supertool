worker_processes 4;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;
events {
worker_connections 4096;
use epoll;
    }

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    log_format 'json escape=json {"time":"$time_local","host":"$host","uri":"$uri","status":$status}';
    access_log /var/log/nginx/access.log json;

    upstream web_cluster {
        least_conn;
        server 10.0.100.1:8080 weight=10 fail_timeout=30s;
        server 10.0.100.2:8080 weight=10 fail_timeout=30s;
        server 10.0.100.3:8080 weight=5 fail_timeout=30s;
        server 10.0.100.4:8080 backup;
    }

    upstream service_a {
        random;
        server 10.0.200.1:9001;
        server 10.0.200.2:9001;
        server 10.0.200.3:9001 down;
    }

    upstream service_b {
        server 10.0.200.10:9002;
        server 10.0.200.11:9002;
    }

    upstream static_cdn {
        server 192.168.1.10:80 weight=3;
        server 192.168.1.11:80 weight=3;
        server 192.168.1.12:80 weight=3;
    }

    server {
        server_name  www.example.com example.com;
        listen 443 ssl http2;
        listen [::]:443 ssl;
        ssl_certificate      /etc/nginx/ssl/example.com/cert.pem;
        ssl_certificate_key  /etc/nginx/ssl/example.com/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /service-a/ {
            proxy_pass http://service_a;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /service-b/ {
            proxy_pass http://service_b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /static/ {
            proxy_pass http://static_cdn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            add_header Cache-Control public, max-age=86400;
        }

        location /upload {
            proxy_pass http://web_cluster;
            client_max_body_size 500m;
            proxy_read_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://web_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /cors/ {
            proxy_pass http://service_a;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /internal/ {
            proxy_pass http://127.0.0.1:9090;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }

        location /old-homepage {
        }

        location /old-blog {
        }

    }

    server {
        server_name  www.example.com example.com;
        listen 80;
        listen [::]:80;
    }

}

