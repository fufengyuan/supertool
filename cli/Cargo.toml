[package]
name = "stool"
version = "4.58.6"
edition = "2024"
description = "SuperTool CLI - Direct CoreService access for task, project, server, and log management"

[[bin]]
name = "stool"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
supertool-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
