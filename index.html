<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperTool Tauri</title>
  </head>
  <body autocapitalize="off">
    <div id="app">
      <!-- Vue mount 前的初始加载态（mount 后被替换） -->
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none">
        <div style="font-size:64px;line-height:1;margin-bottom:16px;animation:splashPulse 1.4s ease-in-out infinite">⚡</div>
        <div style="font-size:20px;font-weight:600;letter-spacing:0.5px;margin-bottom:8px">SuperTool</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5)">正在启动...</div>
      </div>
      <style>
        @keyframes splashPulse {
          0%, 100% { transform: scale(1); opacity: 0.85; }
          50% { transform: scale(1.12); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
