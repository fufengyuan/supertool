[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Agent runtime framework — derived from claw-code runtime crate"

[dependencies]
plugins = { path = "../claw-plugins" }
telemetry = { path = "../claw-telemetry" }
sha2 = "0.10"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
walkdir = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
